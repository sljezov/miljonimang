<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulaator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <h1>Kalkulaator</h1>
    <div class="inputs">
      <input type="number" id="num1" placeholder="Esimene arv">
      <input type="number" id="num2" placeholder="Teine arv">
    </div>
    <div class="buttons">
      <button data-op="+">+</button>
      <button data-op="-">−</button>
      <button data-op="*">×</button>
      <button data-op="/">÷</button>
    </div>
    <div id="result" class="result">Tulemus kuvatakse siin</div>
    <button id="clear">Tühjenda</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
